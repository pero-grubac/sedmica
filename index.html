<!DOCTYPE html>
<html lang="bs">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sedmica</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🂷</text></svg>">
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="paper">

        <h1 class="title">♠ Sedmica</h1>

        <!-- ═══════ SETUP ═══════ -->
        <div id="setup-view">
            <p class="section-label">Igrači</p>
            <p class="setup-hint">Upiši od 2 do 4 igrača</p>
            <div class="players-grid" id="players-grid">
                <div class="player-field">
                    <p class="field-label">Igrač 1</p>
                    <input type="text" id="p1" placeholder="Ime..." maxlength="16" />
                </div>
                <div class="player-field">
                    <p class="field-label">Igrač 2</p>
                    <input type="text" id="p2" placeholder="Ime..." maxlength="16" />
                </div>
                <div class="player-field optional">
                    <p class="field-label">Igrač 3 <span class="opt">(opciono)</span></p>
                    <input type="text" id="p3" placeholder="Ime..." maxlength="16" />
                </div>
                <div class="player-field optional">
                    <p class="field-label">Igrač 4 <span class="opt">(opciono)</span></p>
                    <input type="text" id="p4" placeholder="Ime..." maxlength="16" />
                </div>
            </div>
            <button class="btn btn-primary" onclick="startGame()">Počni igru →</button>
            <p id="setup-error" class="error-msg"></p>
        </div>

        <!-- ═══════ GAME ═══════ -->
        <div id="game-view" class="hidden">

            <!-- Player cards -->
            <div class="player-cards" id="player-cards"></div>

            <!-- Add round button + validation error — between cards and table -->
            <div class="add-round-bar">
                <button class="btn btn-add" onclick="addRound()">+ Dodaj rundu</button>
                <p id="round-error" class="error-msg"></p>
            </div>

            <!-- Score table -->
            <div class="table-section">
                <p class="section-label">Tabela bodova</p>
                <div class="table-wrap">
                    <table id="score-table">
                        <thead id="score-thead"></thead>
                        <tbody id="score-tbody"></tbody>
                    </table>
                </div>
            </div>

            <div class="bottom-bar">
                <button class="reset-btn" onclick="resetGame()">↺ Nova igra</button>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js')
                .catch(e => console.warn('SW greška:', e));
        }
    </script>
</body>

</html>
